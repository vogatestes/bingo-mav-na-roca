async function telaRelatorios(pg) {
  const hoje = S.base.hoje || hojeLocal();
  const ini = hoje.slice(0, 4) + '-01-01';
  pg.innerHTML = html`<div class="cab"><div class="tit"><h1>Participação</h1><p>Escalas cumpridas e presença nos ensaios de cada pessoa.</p></div></div>
    <div class="filtros">
      <label class="campo"><span>De</span><input type="date" name="rde" value="${ini}"></label>
      <label class="campo"><span>Até</span><input type="date" name="rate" value="${hoje}"></label>
      <button class="btn pri" data-a="rAtualizar" style="flex:0 0 auto">Atualizar</button></div>
    <section class="geral-box"><div class="geral-cab"><h2>Participação geral</h2><span class="muted peq">escalas + ensaios</span></div><div id="rGeral"></div></section>`.s;
  const pos = l => l.posicao ? html`<span class="pos ${l.posicao <= 3 ? 'top' : ''}">${l.posicao}º</span>` : '';
  const semDados = todos => todos ? 'Nenhum registro neste período. A participação aparece depois que a presença dos cultos e ensaios é marcada.' : (S.base.me.compartilhado ? 'O ranking aparece para a liderança.' : 'Você ainda não tem registros neste período.');
  A.rAtualizar = async () => {
    const de = $('[name=rde]').value, ate = $('[name=rate]').value;
    const [p, r] = await Promise.all([api('relatorios.participacao', { de, ate }), api('relatorios.presenca', { de, ate })]);
    const g = {};
    p.linhas.forEach(l => { g[l.pessoaId] = { pessoaId: l.pessoaId, nome: l.nome, esc: l, ens: null }; });
    r.linhas.forEach(l => { (g[l.pessoaId] = g[l.pessoaId] || { pessoaId: l.pessoaId, nome: l.nome, esc: null }).ens = l; });
    const geral = Object.values(g).map(x => {
      const feitos = (x.esc ? x.esc.participou : 0) + (x.ens ? x.ens.presentes : 0), total = (x.esc ? x.esc.escalas : 0) + (x.ens ? x.ens.realizados : 0);
      return Object.assign(x, { feitos, total, percentual: total ? Math.round(feitos / total * 100) : null });
    }).sort((a, b) => (b.percentual ?? -1) - (a.percentual ?? -1) || a.nome.localeCompare(b.nome, 'pt-BR'));
    let posG = 0, antG = null; geral.forEach((x, i) => { if (x.percentual !== antG) { posG = i + 1; antG = x.percentual; } x.posicao = posG; });
    const det = (l, ok, tot, extra) => l ? html`<small>${ok}/${tot}${extra}</small>` : html`<small>—</small>`;
    const mini = (rot, l, ok, tot, extra) => l ? html`<div class="mini"><span>${rot}</span><span class="barra"><i style="width:${l.percentual || 0}%"></i></span><b>${l.percentual}%</b>${det(l, ok, tot, extra)}</div>` : html`<div class="mini vaz"><span>${rot}</span><small>sem registros</small></div>`;
    $('#rGeral').innerHTML = v_(geral.length ? html`<div class="geral">${geral.map(x => html`<div class="g-linha">${pos(x)}<div class="g-nome"><b>${x.nome}</b>
        ${mini('Escalas', x.esc, x.esc && x.esc.participou, x.esc && x.esc.escalas, x.esc && (x.esc.faltou || x.esc.justificou) ? ' · ' + (x.esc.faltou ? x.esc.faltou + ' falta' + (x.esc.faltou > 1 ? 's' : '') : '') + (x.esc.faltou && x.esc.justificou ? ', ' : '') + (x.esc.justificou ? x.esc.justificou + ' just.' : '') : '')}
        ${mini('Ensaios', x.ens, x.ens && x.ens.presentes, x.ens && x.ens.realizados, x.ens && (x.ens.faltas || x.ens.justificadas) ? ' · ' + (x.ens.faltas ? x.ens.faltas + ' falta' + (x.ens.faltas > 1 ? 's' : '') : '') + (x.ens.faltas && x.ens.justificadas ? ', ' : '') + (x.ens.justificadas ? x.ens.justificadas + ' just.' : '') : '')}</div>
        <div class="g-total"><strong>${x.percentual}%</strong><small>${x.feitos} de ${x.total}</small></div></div>`)}</div>
      <p class="muted peq">Total = (escalas cumpridas + ensaios com presença) ÷ (escalas conferidas + ensaios realizados). Maior porcentagem primeiro; empates em ordem alfabética.</p>` : html`<div class="vazio">${semDados(p.todos)}</div>`);
  };
  A.rAtualizar();
}

  const at = (S.base.atalhosTodos || []).map(a => Object.assign({}, a));
  pg.innerHTML = html`<div class="cab"><div class="tit"><h1>Configurações</h1></div><a class="btn" href="#/historico">${ico('his')} Histórico</a></div>
    <form class="card" id="fCfg"><h2 style="margin-bottom:12px">Igreja e aplicativo</h2>
      <div class="linha"><label class="campo"><span>Nome do grupo</span><input type="text" name="nomeIgreja" value="${c.nomeIgreja}"></label>
      <label class="campo"><span>Subtítulo</span><input type="text" name="subtitulo" value="${c.subtitulo}"></label></div>
      <div class="linha"><label class="campo"><span>O que integrantes veem</span><select name="membroVeEscala"><option value="completa" ${c.membroVeEscala !== 'minhas' ? raw('selected') : ''}>Escala publicada completa</option><option value="minhas" ${c.membroVeEscala === 'minhas' ? raw('selected') : ''}>Apenas cultos em que estão</option></select></label>
      <label class="campo"><span>Calendário começa em</span><input type="date" name="inicioCalendario" value="${c.inicioCalendario}"></label></div>
      <div class="linha"><label class="campo"><span>Instrumentos essenciais</span><input type="text" name="instrumentosEssenciais" value="${c.instrumentosEssenciais}"><small>Separados por vírgula. A ausência gera aviso de pendência.</small></label>
      <label class="campo"><span>Duração padrão do ensaio (min)</span><input type="number" name="duracaoPadraoEnsaio" value="${c.duracaoPadraoEnsaio}"></label>
      <label class="campo"><span>Mínimo de registros para %</span><input type="number" name="minRegistrosPercentual" value="${c.minRegistrosPercentual}"></label></div>
      <label class="campo"><span>Link do chat da equipe</span><input type="url" name="linkChat" value="${c.linkChat}" placeholder="https:// (ChatGPT, WhatsApp, Telegram…)"><small>Apenas abre o link; não há integração automática.</small></label>
      <button class="btn pri">Salvar configurações</button></form>

    <section class="bloco"><h2>Atalhos</h2><p class="muted peq">Links úteis exibidos no início. Podem ser alterados aqui, sem mexer no código.</p><div id="atl"></div></section>
    ${listas.map(l => html`<section class="bloco"><h2>${l[1]}</h2><div id="lst-${l[0]}"></div></section>`)}
    <section class="bloco"><h2>Logins</h2>
      <p class="muted peq">Acessos de grupo não ficam ligados a uma pessoa: o de Integrantes é um login só, usado por todos. Logins individuais são criados no cadastro de cada pessoa, em <a href="#/pessoas">Pessoas</a>.</p>
      <div id="logins"></div></section>`.s;
  $('#fCfg').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = {}; ['nomeIgreja', 'subtitulo', 'membroVeEscala', 'inicioCalendario', 'instrumentosEssenciais', 'duracaoPadraoEnsaio', 'minRegistrosPercentual', 'linkChat'].forEach(k => { fd[k] = e.target[k].value; });
    try { await api('config.salvar', { config: fd }); await recarregarBase(); toast('Configurações salvas.', 'ok'); montar(); } catch (err) { falha(err); }
  });
  // Logins (acessos de grupo e lista geral)
  let usuarios = (await api('usuarios.listar')).usuarios;
  const desenharLogins = () => {
    $('#logins').innerHTML = v_(html`<div class="lista">${usuarios.map(u => html`<div class="item"><span class="cresce"><b>${u.nome}</b>
      <span class="sub">login <b>${u.login}</b> · ${ROT_PERFIL[u.perfil]}${u.compartilhado ? ' · usado por todos' : ''}${u.ativo ? '' : ' · desativado'}${u.bloqueado ? ' · bloqueado por tentativas' : ''}</span></span>
      ${u.pessoaId ? html`<a class="btn peq" href="#/pessoa/${u.pessoaId}">Abrir</a>` : html`<button class="btn peq" data-a="lgSenha" data-id="${u.id}">Mudar senha</button><button class="btn leve peq" data-a="lgEditar" data-id="${u.id}">Editar</button>`}</div>`)}</div>
      <div class="acoes" style="margin-top:10px"><button class="btn" data-a="lgNovo">+ Acesso de grupo</button></div>`);
  };
  desenharLogins();
  const formLogin = u => html`<label class="campo"><span>Nome do acesso</span><input type="text" name="ap" value="${u.apelido || ''}" placeholder="Ex.: Integrantes" maxlength="60"></label>
    <div class="linha"><label class="campo"><span>Login</span><input type="text" name="lg" value="${u.login || ''}" autocapitalize="none" placeholder="ex.: integrantes"></label>
    <label class="campo"><span>Perfil</span><select name="pf">${['MEMBRO', 'LIDER', 'ADMIN'].map(k => html`<option value="${k}" ${(u.perfil || 'MEMBRO') === k ? raw('selected') : ''}>${ROT_PERFIL[k]}</option>`)}</select></label></div>
    ${u.id ? html`<label class="check"><input type="checkbox" name="at" ${u.ativo ? raw('checked') : ''}> Acesso ativo</label>` : html`<label class="campo"><span>Senha</span><input type="text" name="sn" autocomplete="off"><small>Mínimo de 8 caracteres, com letras e números. Ela não precisa ser trocada no primeiro acesso.</small></label>`}`;
  A.lgNovo = () => modal({ titulo: 'Novo acesso de grupo', corpo: formLogin({}), botoes: [{ t: 'Cancelar' }, { t: 'Criar', cls: 'pri', a: async m => {
    await api('usuarios.salvar', { usuario: { pessoaId: '', apelido: $('[name=ap]', m).value, login: $('[name=lg]', m).value, perfil: $('[name=pf]', m).value, senha: $('[name=sn]', m).value } });
    usuarios = (await api('usuarios.listar')).usuarios; desenharLogins(); toast('Acesso criado.', 'ok'); } }] });
  A.lgEditar = el => { const u = usuarios.find(x => x.id === el.dataset.id);
    modal({ titulo: 'Editar acesso', corpo: formLogin(u), botoes: [{ t: 'Cancelar' }, { t: 'Salvar', cls: 'pri', a: async m => {
      await api('usuarios.salvar', { usuario: { id: u.id, pessoaId: '', apelido: $('[name=ap]', m).value, login: $('[name=lg]', m).value, perfil: $('[name=pf]', m).value, ativo: $('[name=at]', m).checked } });
      usuarios = (await api('usuarios.listar')).usuarios; desenharLogins(); toast('Acesso salvo.', 'ok'); } }] }); };
  A.lgSenha = el => { const u = usuarios.find(x => x.id === el.dataset.id);
    modal({ titulo: 'Mudar senha: ' + u.nome, corpo: html`<label class="campo"><span>Nova senha</span><input type="text" name="sn" autocomplete="off"><small>Quem estiver usando este acesso precisará entrar de novo com a senha nova.</small></label>`,
      botoes: [{ t: 'Cancelar' }, { t: 'Salvar senha', cls: 'pri', a: async m => { await api('usuarios.senha', { id: u.id, senha: $('[name=sn]', m).value }); toast('Senha alterada.', 'ok'); } }] }); };

  // Atalhos
  const desenharAt = () => {
    $('#atl').innerHTML = html`${at.map((a, k) => html`<div class="slot" style="flex-wrap:wrap"><input type="text" value="${a.titulo}" placeholder="Título" data-i="atT" data-k="${k}" style="flex:1 1 140px;min-height:38px">
      <input type="url" value="${a.url}" placeholder="https://" data-i="atU" data-k="${k}" style="flex:2 1 220px;min-height:38px">
      <select data-c="atV" data-k="${k}" style="max-width:150px"><option value="todos" ${a.visivelPara !== 'lideranca' ? raw('selected') : ''}>Todos</option><option value="lideranca" ${a.visivelPara === 'lideranca' ? raw('selected') : ''}>Só liderança</option></select>
      <button class="btn leve peq" data-a="atX" data-k="${k}" aria-label="Remover">✕</button></div>`)}
      <div class="acoes"><button class="btn peq" data-a="atAdd">+ Adicionar atalho</button><button class="btn pri peq" data-a="atSalvar">Salvar atalhos</button></div>`.s;
  };
  desenharAt();
  A.atT = el => { at[Number(el.dataset.k)].titulo = el.value; }; A.atU = el => { at[Number(el.dataset.k)].url = el.value; };
  A.atV = el => { at[Number(el.dataset.k)].visivelPara = el.value; };
  A.atX = el => { at.splice(Number(el.dataset.k), 1); desenharAt(); };
  A.atAdd = () => { at.push({ titulo: '', url: '', visivelPara: 'todos' }); desenharAt(); };
  A.atSalvar = async () => { await api('atalhos.salvar', { itens: at.filter(a => a.titulo || a.url) }); await recarregarBase(); toast('Atalhos salvos.', 'ok'); };
  // Listas configuráveis
  listas.forEach(([tab, , itens]) => {
    const L = itens.map(i => Object.assign({}, i, { ativo: i.ativo === undefined ? true : i.ativo !== 'FALSE' }));
    const el = $('#lst-' + tab);
    const desenharL = () => {
      el.innerHTML = html`${L.map((it, k) => html`<div class="slot" style="flex-wrap:wrap">
        <span class="ord"><button data-a="lUp" data-t="${tab}" data-k="${k}" aria-label="Subir">▲</button><button data-a="lDown" data-t="${tab}" data-k="${k}" aria-label="Descer">▼</button></span>
        <input type="text" value="${it.nome}" data-i="lN" data-t="${tab}" data-k="${k}" style="flex:1 1 160px;min-height:38px" aria-label="Nome">
        ${tab === 'TiposCulto' ? html`<select data-c="lD" data-t="${tab}" data-k="${k}" aria-label="Dia">${DIAS.map((d, i) => html`<option value="${i}" ${Number(it.diaSemana) === i ? raw('selected') : ''}>${d}</option>`)}</select>
          <input type="time" value="${it.horario}" data-i="lH" data-t="${tab}" data-k="${k}" style="width:120px;min-height:38px" aria-label="Horário">
          <input type="number" value="${it.duracaoMin || 120}" data-i="lM" data-t="${tab}" data-k="${k}" style="width:90px;min-height:38px" aria-label="Duração em minutos" title="Duração (min)">` : ''}
        ${tab === 'Instrumentos' || tab === 'TiposCulto' ? html`<label class="check peq"><input type="checkbox" data-c="lA" data-t="${tab}" data-k="${k}" ${it.ativo ? raw('checked') : ''}> ativo</label>` : ''}
        <button class="btn leve peq" data-a="lX" data-t="${tab}" data-k="${k}" aria-label="Remover">✕</button></div>`)}
        <div class="acoes"><button class="btn peq" data-a="lAdd" data-t="${tab}">+ Adicionar</button><button class="btn pri peq" data-a="lSalvar" data-t="${tab}">Salvar</button></div>
        ${tab === 'TiposCulto' ? html`<p class="muted peq">Mudanças valem para os próximos meses gerados. Cultos já criados não são alterados.</p>` : ''}`.s;
    };
    desenharL();
    LISTAS[tab] = { L, desenharL };
  });
  const LL = el => LISTAS[el.dataset.t];
  A.lN = el => { LL(el).L[Number(el.dataset.k)].nome = el.value; };
  A.lH = el => { LL(el).L[Number(el.dataset.k)].horario = el.value; };
  A.lM = el => { LL(el).L[Number(el.dataset.k)].duracaoMin = el.value; };
  A.lD = el => { LL(el).L[Number(el.dataset.k)].diaSemana = el.value; };
  A.lA = el => { LL(el).L[Number(el.dataset.k)].ativo = el.checked; };
  A.lX = el => { LL(el).L.splice(Number(el.dataset.k), 1); LL(el).desenharL(); };
  A.lAdd = el => { LL(el).L.push({ nome: '', ativo: true, diaSemana: 0, horario: '19:00', duracaoMin: 120 }); LL(el).desenharL(); };
  const mvL = (el, d) => { const L = LL(el).L, k = Number(el.dataset.k), j = k + d; if (j < 0 || j >= L.length) return; const t = L[k]; L[k] = L[j]; L[j] = t; LL(el).desenharL(); };
  A.lUp = el => mvL(el, -1); A.lDown = el => mvL(el, 1);
  A.lSalvar = async el => { await api('listas.salvar', { tabela: el.dataset.t, itens: LL(el).L }); toast('Lista salva.', 'ok'); S.base = null; await recarregarBase(); rota(); };
}
const LISTAS = {};

/* ======================== Histórico ======================== */
async function telaHistorico(pg) {
  const ents = [['', 'Tudo'], ['Escala', 'Escalas'], ['Pessoa', 'Pessoas'], ['Ensaio', 'Ensaios e presença'], ['Musica', 'Músicas'], ['Usuario', 'Logins e permissões'], ['Playlist', 'Playlists'], ['Config', 'Configurações']];
  pg.innerHTML = html`<div class="cab"><div class="tit"><h1>Histórico de alterações</h1><p>Quem alterou o quê, e quando.</p></div></div>
    <div class="filtros"><label class="campo"><span>Área</span><select name="he">${ents.map(e => html`<option value="${e[0]}">${e[1]}</option>`)}</select></label>
    <label class="campo"><span>Buscar</span><input type="search" name="hb" placeholder="Nome, ação…"></label><button class="btn pri" data-a="hBuscar" style="flex:0 0 auto">Buscar</button></div><div id="hout"></div>`.s;
  A.hBuscar = async () => {
    const r = await api('historico.listar', { entidade: $('[name=he]').value, busca: $('[name=hb]').value, limite: 200 });
    $('#hout').innerHTML = v_(r.itens.length ? html`<div class="lista">${r.itens.map(h => html`<div class="item"><span class="cresce"><span>${h.resumo}</span><span class="sub">${h.usuario} · ${fmtQuando(h.dataHora)}</span></span></div>`)}</div>` : html`<div class="vazio">Nada encontrado.</div>`);
  };
  A.hBuscar();
}

/* ======================== Início ======================== */
montar();
</script>
</body>
</html>
