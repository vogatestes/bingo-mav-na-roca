<style>
:root{
  /* Preto, branco e cinzas. Archivo nos títulos (peso da escala impressa), Figtree no texto. */
  --brand:#111111; --brand-2:#2a2a2a; --brand-ink:#ffffff;
  --ink:#111111; --muted:#5a5a5a; --soft:#8c8c8c; --line:#dcdcdc; --bg:#f3f3f3; --surface:#ffffff; --surface-2:#f6f6f6; --hover:#ececec;
  --min:#111111; --min-bg:#e9e9e9; --bac:#111111; --bac-bg:#e9e9e9; --mus:#111111; --mus-bg:#e9e9e9;
  --ok:#111111; --ok-bg:#e9e9e9; --warn:#3d3d3d; --warn-bg:#ececec; --bad:#111111; --bad-bg:#e4e4e4;
  --r-lg:14px; --r:10px; --r-sm:6px;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Archivo','Arial Black',Arial,sans-serif;
  --nav-w:236px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #111;outline-offset:2px;border-radius:4px;box-shadow:0 0 0 5px #fff}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estrutura ---------- */
.shell{display:flex;min-height:100vh}
.side{width:var(--nav-w);background:var(--brand);color:var(--brand-ink);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;gap:4px;overflow:auto}
.side .marca{padding:4px 10px 18px}
.logo{display:block;color:currentColor}
.logo svg{display:block;width:100%;height:auto}
.side .marca .logo{width:58px;margin-bottom:12px}
.side .marca .logo svg{width:100%;height:auto}
.top .logo{width:34px;flex:none}
.login .logo{width:92px;margin-bottom:18px;color:#111}
.side .marca b{display:block;font-family:var(--f-head);font-weight:900;font-size:1.25rem;line-height:1.1;letter-spacing:.04em;text-transform:uppercase}
.side .marca span{opacity:.75;font-size:.85rem}
.side a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;padding:9px 10px;border-radius:10px;opacity:.88}
.side a:hover{background:rgba(255,255,255,.1);opacity:1}
.side a.on{background:rgba(255,255,255,.16);opacity:1;font-weight:700}
.side .rodape{margin-top:auto;font-size:.85rem;opacity:.8;padding:10px}
.side svg,.tabs svg{width:20px;height:20px;flex:none}
.main{flex:1;margin-left:var(--nav-w);min-width:0}
.top{display:none}
.page{max-width:1080px;margin:0 auto;padding:28px 28px 60px}
.tabs{display:none}
@media (max-width:860px){
  .side{display:none}
  .main{margin-left:0}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:10px 14px;min-height:54px}
  .top b{font-family:var(--f-head);font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top button{background:transparent;border:0;color:inherit;padding:6px;display:flex}
  .page{padding:18px 16px calc(96px + var(--safe-b))}
  .tabs{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
  .tabs::-webkit-scrollbar{display:none}
  .tabs.fim{-webkit-mask-image:none;mask-image:none}
  .tabs a{flex:0 0 auto;min-width:78px;scroll-snap-align:start;white-space:nowrap;padding-left:8px!important;padding-right:8px!important;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);text-decoration:none;padding:4px 0}
  .tabs a.on{color:var(--brand);font-weight:700}
  h1{font-size:1.45rem}
}

/* ---------- Componentes ---------- */
.cab{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.cab .tit{flex:1;min-width:200px}
.cab p{margin:4px 0 0;color:var(--muted)}
.voltar{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:.95rem;margin-bottom:8px;background:none;border:0;padding:0;cursor:pointer}
.voltar:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;min-height:42px}
.btn:hover{border-color:#c4c9d6;background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2)}
.btn.perigo{color:var(--bad);border-color:#f0c7c7}
.btn.perigo:hover{background:var(--bad-bg)}
.btn.leve{border-color:transparent;background:transparent;color:var(--brand)}
.btn.leve:hover{background:rgba(45,58,100,.07)}
.btn.peq{padding:5px 10px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.pri[disabled]{background:#fff;color:#555;border-color:var(--line);opacity:1}
.btn svg{width:18px;height:18px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acoes select{width:auto;min-width:0}
.navmes{flex-wrap:nowrap}.navmes select{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card + .card{margin-top:14px}
.bloco{margin-top:26px}
.bloco > h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.vazio{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;background:var(--surface)}
.muted{color:var(--muted)} .peq{font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.min{background:var(--min-bg);color:var(--min);border-color:transparent}
.chip.bac{background:var(--bac-bg);color:var(--bac);border-color:transparent}
.chip.mus{background:var(--mus-bg);color:var(--mus);border-color:transparent}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:2px 9px;border-radius:999px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.RASCUNHO{color:var(--warn);background:var(--warn-bg)}
.st.PUBLICADA{color:var(--ok);background:var(--ok-bg)}
.st.CANCELADA{color:var(--bad);background:var(--bad-bg)}
.st.AGENDADO{color:var(--brand);background:#eceff8}.st.REALIZADO{color:var(--ok);background:var(--ok-bg)}.st.CANCELADO{color:var(--bad);background:var(--bad-bg)}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pend span{font-size:.82rem;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.pend span.info{background:var(--surface-2);color:var(--muted)}

/* Formulários */
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.campo > span{font-weight:700;font-size:.92rem}
.campo small{color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=url],input[type=number],input[type=search],input[type=tel],select,textarea{
  width:100%;border:1px solid #cfd4df;background:#fff;border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(45,58,100,.15)}
.linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.seg{display:inline-flex;border:1px solid #cfd4df;border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700;min-height:40px}
.seg button + button{border-left:1px solid #cfd4df}
.seg button.on{background:var(--brand);color:#fff}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.filtros > *{flex:1 1 160px}
.filtros .campo{margin:0}

/* Escalas: semana e culto */
.semana{margin-top:22px}
.semana-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--brand)}
.semana-cab h3{color:var(--brand)}
.culto{display:grid;grid-template-columns:86px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-decoration:none;color:inherit;margin-bottom:10px;transition:border-color .15s}
a.culto:hover{border-color:var(--brand)}
.culto.CANCELADA{opacity:.65}
.data{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--brand);color:var(--brand-ink);padding:8px 4px;text-align:center;align-self:start;min-height:86px}
.data .dw{font-size:.82rem;opacity:.85}
.data .dd{font-family:var(--f-head);font-size:2rem;font-weight:700;line-height:1}
.data .hh{font-size:.95rem;font-weight:700;margin-top:2px}
.culto.RASCUNHO .data{background:#fff;color:var(--brand);border:2px dashed var(--brand)}
.culto-tit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.culto-tit b{font-size:1.05rem}
.equipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px}
.equipe .f{font-size:.82rem;font-weight:700;margin-bottom:2px}
.equipe .f.min{color:var(--min)} .equipe .f.bac{color:var(--bac)} .equipe .f.mus{color:var(--mus)}
.equipe ul{list-style:none;margin:0;padding:0}
.equipe li{line-height:1.35;padding:1px 0}
.equipe li .i{color:var(--muted);font-size:.88rem}
.equipe .falta{color:var(--soft);font-style:italic}
.realce{background:#fff3c4;border-radius:4px;padding:0 3px}
.musl{margin:8px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--muted)}
@media (max-width:560px){.culto{grid-template-columns:64px 1fr;gap:12px;padding:12px}.data{min-height:72px}.data .dd{font-size:1.6rem}}

/* Editor de escala */
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:8px;min-height:50px}
.slot .nome{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.slot .nome.vz{color:var(--soft);font-weight:400;font-style:italic}
.slot select{max-width:170px;min-height:38px;padding:6px 8px}
.slot .ord{display:flex;flex-direction:column}
.slot .ord button{border:0;background:transparent;cursor:pointer;padding:0 4px;line-height:1;color:var(--muted);font-size:1rem}
.funcao-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.funcao-cab h3{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.min{background:var(--min)} .dot.bac{background:var(--bac)} .dot.mus{background:var(--mus)}
.barra-salvar{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){.barra-salvar{bottom:calc(64px + var(--safe-b))}}
.aviso{padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:#7a3a05;margin:10px 0}
.aviso.erro{background:var(--bad-bg);color:#7f1414}
.aviso.ok{background:var(--ok-bg);color:#0f5a2c}
.aviso ul{margin:6px 0 0;padding-left:20px}
.meta{font-size:.85rem;color:var(--muted);margin-top:10px}

/* Painel */
.ola{margin-bottom:22px}
.ola h1{font-size:2rem}
.prox{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:var(--r-lg);padding:20px}
.prox .data{min-width:96px;min-height:104px}
.prox .data .dd{font-size:2.6rem}
@media (max-width:560px){.prox{grid-template-columns:1fr}.prox .data{flex-direction:row;gap:10px;min-height:0;padding:10px 14px;justify-content:flex-start}.prox .data .dd{font-size:1.8rem}}
.atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.atalho{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:700;min-height:88px}
.atalho:hover{border-color:var(--brand)}
.atalho svg{width:24px;height:24px;color:var(--brand)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px}
.item:last-child{border-bottom:0}
a.item:hover,button.item:hover{background:var(--surface-2)}
button.item{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.item .cresce{flex:1;min-width:0}
.item .cresce > b,.item .cresce > div:first-child{display:block;overflow:hidden;text-overflow:ellipsis}
.item .sub{display:block;font-size:.88rem;color:var(--muted)}
.links{display:flex;gap:6px;flex-wrap:wrap}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:#fff;font-weight:700}
.lk:hover{border-color:var(--brand)}
.lk svg{width:14px;height:14px}

/* Vozes */
.vozes-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.vozes{border-collapse:collapse;width:100%;min-width:520px}
.vozes th,.vozes td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.vozes th:last-child,.vozes td:last-child{border-right:0}
.vozes thead th{background:var(--surface-2);font-size:.88rem}
.vozes tbody th{background:var(--surface-2)}
.vozes td.cel{cursor:default;min-width:110px}
.vozes td.cel.ed{cursor:pointer}
.vozes td.cel.ed:hover{background:#f4f6fc}
.vozes td.cel .marc{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--min-bg);color:var(--min);font-weight:700;font-size:.85rem;margin:1px 0}
.vozes td.cel .marc.so{background:#eceff8;color:var(--brand)}
.parte-ed{display:flex;flex-direction:column;gap:6px}
.parte-ed .acoes{gap:2px;flex-wrap:nowrap}.parte-ed .btn.peq{padding:3px 7px;min-height:30px}
.vozes tbody th{width:230px}

/* Presença */
.pres{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pres:last-child{border-bottom:0}
.pres .seg button{padding:7px 10px;font-size:.88rem}
.pres .seg button.on.PRESENTE{background:var(--ok)} .pres .seg button.on.FALTA{background:var(--bad)} .pres .seg button.on.JUSTIFICADA{background:var(--warn)} .pres .seg button.on.PENDENTE{background:var(--soft)}
.pres .just{grid-column:1 / -1}
@media (max-width:640px){.pres{grid-template-columns:1fr}.pres .seg{width:100%}.pres .seg button{flex:1;padding:7px 4px}}

/* Tabelas */
.tabela-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
table.t{border-collapse:collapse;width:100%}
.t th,.t td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{font-size:.85rem;color:var(--muted);background:var(--surface-2)}
.t td.num,.t th.num{text-align:right}
.t tr:last-child td{border-bottom:0}
.barra{height:8px;border-radius:4px;background:#e6e9f0;overflow:hidden;min-width:80px}
.barra i{display:block;height:100%;background:var(--ok)}

/* Modal, toasts, carregando */
.fundo{position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:min(88vh,760px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,20,40,.3)}
.modal.larga{max-width:760px}
.modal header{padding:18px 20px 10px;display:flex;align-items:center;gap:10px}
.modal header h2{flex:1}
.modal .x{border:0;background:transparent;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal .corpo{padding:4px 20px 12px;overflow:auto}
.modal footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
@media (max-width:560px){.fundo{align-items:flex-end;padding:0}.modal{max-height:92vh;border-radius:18px 18px 0 0}}
.picker-lista{max-height:52vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.picker-lista button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;min-height:48px}
.picker-lista button:last-child{border-bottom:0}
.picker-lista button:hover{background:var(--surface-2)}
.picker-lista button[disabled]{color:var(--soft);cursor:not-allowed;background:#fafafa}
#toasts{position:fixed;z-index:80;pointer-events:none;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
@media (max-width:860px){#toasts{bottom:calc(80px + var(--safe-b))}}
.toast{padding:12px 16px;border-radius:12px;background:#1f2a44;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700;animation:sobe .2s ease-out}

/** Chama o servidor. Sempre devolve os dados ou lança um Error com .code e .info. */
async function api(action, data) {
  barra(1);
  try {
    const req = { action, data: data || {}, token: S.token };
    let r;
    if (viaAppsScript()) {
      r = await new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail).api(req));
    } else {
      const url = apiUrl();
      if (!url) throw Object.assign(new Error('Endereço do servidor não configurado.'), { code: 'SEM_API' });
      let resp;
      try {
        resp = await fetch(url, { method: 'POST', redirect: 'follow', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
      } catch (e) {
        throw Object.assign(new Error('Sem conexão com o servidor. Verifique sua internet e tente de novo.'), { code: 'REDE' });
      }
      const txt = await resp.text();
      try { r = JSON.parse(txt); } catch (e) {
        throw Object.assign(new Error('O servidor respondeu de forma inesperada. Confira se o app da Web foi implantado com acesso para "Qualquer pessoa".'), { code: 'RESPOSTA' });
      }
    }
    if (!r || !r.ok) {
      const e = new Error((r && r.error) || 'Erro desconhecido.');
      e.code = r && r.code; e.info = r;
      if (e.code === 'SESSAO') { sairLocal(); toast(e.message, 'erro'); }
      if (e.code === 'TROCAR_SENHA') { location.hash = '#/senha'; }
      throw e;
    }
    return r.data;
  } finally { barra(-1); }
}

/** Ações por delegação: elementos com data-a="nome" chamam A.nome(el, evento). */
const A = {};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) { ev.preventDefault(); Promise.resolve(f(el, ev)).catch(falha); }
});

/** Abre um modal. Retorna { el, fechar }. botoes: [{t, a, cls}] com a = função (retorne false para não fechar). */
function modal({ titulo, corpo, botoes, larga, aoFechar }) {
  const fundo = document.createElement('div');
  fundo.className = 'fundo';
  fundo.innerHTML = html`<div class="modal ${larga ? 'larga' : ''}" role="dialog" aria-modal="true" aria-label="${titulo}">
    <header><h2>${titulo}</h2><button class="x" aria-label="Fechar">×</button></header>
    <div class="corpo">${corpo}</div>
    ${botoes && botoes.length ? html`<footer>${botoes.map((b, i) => html`<button class="btn ${b.cls || ''}" data-b="${i}">${b.t}</button>`)}</footer>` : ''}
  </div>`.s;
  const anterior = document.activeElement;
  const fechar = v => { fundo.remove(); document.removeEventListener('keydown', tecla); if (anterior && anterior.focus) anterior.focus(); if (aoFechar) aoFechar(v); };
  const tecla = e => { if (e.key === 'Escape') fechar(null); };
  document.addEventListener('keydown', tecla);
  fundo.addEventListener('click', async e => {
    if (e.target === fundo || e.target.closest('.x')) return fechar(null);
    const b = e.target.closest('[data-b]');
    if (b) {
      const bt = botoes[Number(b.dataset.b)];
      if (!bt.a) return fechar(null);
      b.disabled = true;
      try { const r = await bt.a(fundo); if (r !== false) fechar(r); } catch (err) { falha(err); } finally { b.disabled = false; }
    }
  });
  $('#modais').appendChild(fundo);
  setTimeout(() => { const f = $('input,select,textarea', fundo) || $('.x', fundo); if (f) f.focus(); }, 30);
  return { el: fundo, fechar };
}
function confirmar(msg, sim, perigo) {
  return new Promise(ok => {
    modal({ titulo: 'Confirmar', corpo: html`<p>${msg}</p>`, aoFechar: v => ok(v === true),
      botoes: [{ t: 'Voltar' }, { t: sim || 'Confirmar', cls: perigo ? 'perigo' : 'pri', a: () => true }] });
  });
}

/** Lista pesquisável de pessoas. Retorna a pessoa escolhida ou null. */
function escolherPessoa({ titulo, filtro, bloqueados, motivo }) {
  return new Promise(ok => {
    const lista = S.base.pessoas.filter(p => p.ativo && (!filtro || filtro(p)));
    const desenhar = (el, q) => {
      const f = lista.filter(p => norm(p.nome).indexOf(norm(q)) >= 0);
      $('.picker-lista', el).innerHTML = (f.length ? f.map(p => {
        const bloq = bloqueados && bloqueados.indexOf(p.id) >= 0;
        return html`<button data-p="${p.id}" ${bloq ? raw('disabled') : ''}><span class="cresce"><b>${p.nome}</b>
          <span class="sub">${papeis(p)}${bloq ? ' · ' + (motivo || 'já selecionado') : ''}</span></span></button>`.s;
      }).join('') : html`<div class="vazio">Ninguém encontrado. Confira o cadastro em Pessoas (função, instrumento e status ativo).</div>`.s);
    };
    const m = modal({ titulo: titulo || 'Escolher pessoa', aoFechar: v => ok(v || null),
      corpo: html`<input type="search" placeholder="Buscar pelo nome…" aria-label="Buscar pelo nome"><div class="picker-lista"></div>` });
    desenhar(m.el, '');
    $('input', m.el).addEventListener('input', e => desenhar(m.el, e.target.value));
    $('.picker-lista', m.el).addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled) m.fechar(P(b.dataset.p)); });
  });
}
function papeis(p) {
  const r = [];
  if (p.ministro) r.push('Ministro(a)'); if (p.back) r.push('Back');
  if (p.musico) r.push(p.instrumentos.map(i => INS(i).nome).join(', ') || 'Músico');
  return r.join(' · ') || 'Sem função definida';
}

  });
}

/* PDF e impressão */
function baixarBase64(b64, nome) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function imprimirHtml(h) {
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  f.onload = () => { setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60000); }, 300); };
  f.srcdoc = h;
}
async function gerarPdf(params, modo) {
  if (window.__DEMO__) return window.__DEMO__.pdf(await api('pdf.escala', Object.assign({}, params, { formato: 'html' })));
  const d = await api('pdf.escala', Object.assign({ formato: modo === 'imprimir' ? 'html' : 'pdf' }, params));
  if (modo === 'imprimir') imprimirHtml(d.html); else { baixarBase64(d.base64, d.nome); toast('PDF gerado: ' + d.nome, 'ok'); }
}

];
let saidaPendente = null; // função que pergunta antes de sair de uma tela com alterações
async function rota() {
  if (!S.token) return montar();
  const pg = $('#pg');
  if (!pg) return montar();
  const h = location.hash.split('?')[0] || '#/';
  const secao = { culto: '#/escalas', musica: '#/musicas', pessoa: '#/pessoas', ensaio: '#/ensaios', playlist: '#/musicas', playlists: '#/musicas' }[h.split('/')[1].split('?')[0]] || h;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === secao));
  const tabs = $('.tabs'), ativa = tabs && $('a.on', tabs);
  if (ativa && tabs.scrollWidth > tabs.clientWidth) { const r = ativa.getBoundingClientRect(); if (r.left < 0 || r.right > innerWidth) tabs.scrollLeft += r.left - 16; }
  if (tabs && !tabs.dataset.ok) { tabs.dataset.ok = 1; const f = () => tabs.classList.toggle('fim', tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 4); tabs.addEventListener('scroll', f, { passive: true }); f(); }
  try {
    if (!S.base) {
      pg.innerHTML = '<p class="muted">Carregando…</p>';
      try { await recarregarBase(); } catch (e) { if (e.code === 'TROCAR_SENHA') return telaSenha(); throw e; }
      if (S.base.me.trocarSenha && h !== '#/senha') { location.hash = '#/senha'; return; }
      return montar();
    }
    for (const [re, fn] of ROTAS) {
      const m = h.match(re);
      if (m) {
        saidaPendente = null;
        pg.classList.add('ocupado'); pg.setAttribute('aria-busy', 'true');
        try { await fn(pg, decodeURIComponent(m[1] || '')); } finally { pg.classList.remove('ocupado'); pg.removeAttribute('aria-busy'); }
        window.scrollTo(0, 0); pg.focus({ preventScroll: true }); return;
      }
    }
    pg.innerHTML = html`<div class="vazio">Página não encontrada. <a href="#/">Voltar ao início</a></div>`.s;
  } catch (e) {
    if (e.code === 'SESSAO' || e.code === 'TROCAR_SENHA') return;
    pg.innerHTML = html`<div class="aviso erro"><b>Não foi possível carregar esta tela.</b><br>${e.message}</div><button class="btn" data-a="recarregar">Tentar de novo</button>`.s;
  }
}

    <p class="peq muted">Dica: para não precisar disso em cada aparelho, a liderança pode colar a URL na constante API_URL do index.html.</p></form></div>`.s;
  $('#fApi').addEventListener('submit', async e => {
    e.preventDefault();
    const url = e.target.url.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) return toast('A URL deve ter o formato https://script.google.com/macros/s/…/exec', 'erro');
    try {
      barra(1);
      const r = await fetch(url + '?ping=1').then(x => x.json());
      if (!r || r.app !== 'ministerio-louvor') throw new Error('Essa URL não é do aplicativo do ministério.');
      localStorage.setItem('ml_api', url); toast('Servidor conectado.', 'ok'); montar();
    } catch (err) { toast('Não foi possível conectar: ' + (err.message || err) + '. Confira a implantação com acesso "Qualquer pessoa".', 'erro'); }
    finally { barra(-1); }
  });
}

/* ======================== Escala mensal (tabela com arrastar) ======================== */
const EF = { ano: 0, mes: 0, destaque: (() => { try { return localStorage.getItem('mav_destaque') || ''; } catch (e) { return ''; } })() };
const ROT_PERFIL = { ADMIN: 'Administrador', LIDER: 'Liderança', MEMBRO: 'Integrante' };
const juntar = arr => !arr.length ? '' : arr.length === 2 ? arr[0] + ' e ' + arr[1] : arr.join(' / ');
function periodo(c, todos) {
  if (todos.filter(x => x.data === c.data).length < 2) return '—';
  const h = Number(c.horario.split(':')[0]);
  return h < 12 ? 'Manhã' : h < 18 ? 'Tarde' : 'Noite';
}
async function telaEscalas(pg) {
  if (window.__escLimpar) window.__escLimpar();
  const q = qs(), hoje = S.base.hoje || hojeLocal();
  EF.ano = Number(q.get('ano')) || EF.ano || Number(hoje.slice(0, 4));
  EF.mes = Number(q.get('mes')) || EF.mes || Number(hoje.slice(5, 7));
  const d = await api('escalas.mes', { ano: EF.ano, mes: EF.mes });
  const ed = pode('escalas.editar');
  const M = { cultos: d.cultos, compromissos: d.compromissos || [] };
  const compromisso = (pid, data) => M.compromissos.find(c => c.pessoaId === pid && c.de <= data && c.ate >= data);
  const eu = S.base.me.pessoaId;
  let sel = null;          // pessoa escolhida por toque: { pessoaId, instrumentoId, origem }
  const rascunhos = () => M.cultos.filter(c => c.status === 'RASCUNHO');

  /* ---- desenho ---- */
  const chip = (c, it) => html`<span class="chipe ${it.pessoaId === eu || it.pessoaId === EF.destaque ? 'eu' : ''} ${it.pessoaAtiva === false ? 'inativo' : ''}" data-chip="${c.id}|${it.funcao}|${it.pessoaId}|${it.instrumentoId || ''}" title="Arraste para mover">
    ${it.funcao === 'MUSICO' ? html`<span class="i">${it.instrumento}</span>` : ''}${it.nome}<button type="button" data-a="tirar" aria-label="Tirar ${it.nome}">×</button></span>`;
  const leitura = (arr, mus) => {
    if (!arr.length) return html`<span class="vazio-cel">—</span>`;
    if (mus) return raw(arr.map(i => html`<div><span class="muted peq">${i.instrumento}:</span> <span class="${i.pessoaId === eu || i.pessoaId === EF.destaque ? 'eu' : ''}">${i.nome}</span></div>`.s).join(''));
    const nomes = arr.map(i => (i.pessoaId === eu || i.pessoaId === EF.destaque) ? '<span class="eu">' + esc(i.nome) + '</span>' : esc(i.nome));
    return raw(nomes.length === 2 ? nomes[0] + ' e ' + nomes[1] : nomes.join(' / '));
  };
  const celula = (c, f, arr, rot) => {
    const canc = c.status === 'CANCELADA';
    if (!ed || canc) return html`<td data-rot="${rot}" class="leitura">${leitura(arr, f === 'MUSICO')}</td>`;
    return html`<td data-rot="${rot}" class="drop" data-drop="${c.id}|${f}"><div class="chips">${arr.length ? arr.map(i => chip(c, i)) : html`<span class="vazio-cel">—</span>`}</div></td>`;
  };
  const linhas = () => {
    let semanaAnt = '';
    return M.cultos.map(c => {
      const nova = c.semana !== semanaAnt; semanaAnt = c.semana;
      return html`<tr class="${c.status} ${nova ? 'semana-ini' : ''}" data-culto="${c.id}">
        <td class="c-data"><a href="#/culto/${c.id}" title="Músicas, observações e status">${fmtDM(c.data)}</a><small>${DIAS_C[dow(c.data)]} · ${fmtHora(c.horario)}${c.nome ? ' · ' + c.nome : ''}</small>
          ${c.status === 'RASCUNHO' ? html`<span class="tg">rascunho</span>` : c.status === 'CANCELADA' ? html`<span class="tg canc">cancelado</span>` : ''}</td>
        <td class="c-per">${periodo(c, M.cultos)}</td>
        ${celula(c, 'MINISTRO', c.ministros, 'Ministros')}${celula(c, 'BACK', c.backs, 'Back vocal')}${celula(c, 'MUSICO', c.musicos, 'Músicos')}
      </tr>`;
    });
  };
  let palGrupo = 'min';
  /** Em quantos cultos (não cancelados) do mês a pessoa já está. */
  const qtdEscalas = pid => M.cultos.filter(c => c.status !== 'CANCELADA' && [].concat(c.ministros, c.backs, c.musicos).some(i => i.pessoaId === pid)).length;
  const paleta = () => {
    const ativos = S.base.pessoas.filter(p => p.ativo);
    const pc = (p, insId, sub) => html`<span class="pchip ${sel && sel.pessoaId === p.id && sel.instrumentoId === (insId || '') && !sel.origem ? 'sel' : ''}" data-pchip="${p.id}|${insId || ''}" data-n="${norm(p.nome)}" role="button" tabindex="0" title="${p.nome}: ${qtdEscalas(p.id)} escala(s) neste mês"><span>${p.nome} <span class="qtd">(${qtdEscalas(p.id)})</span></span>${sub ? html`<small>${sub}</small>` : ''}</span>`;
    const grupo = (tit, lista) => html`<h3>${tit}</h3><div class="grupo">${lista.length ? lista : html`<span class="sem">Ninguém cadastrado.</span>`}</div>`;
    const instrs = S.base.instrumentos.filter(i => ativos.some(p => p.musico && p.instrumentos.indexOf(i.id) >= 0));
    const toque = !matchMedia('(hover:hover) and (pointer:fine)').matches;
    return html`<div class="pal-topo"><h2>Pessoas</h2><span class="pal-dica">${toque ? 'Arraste o nome para cima até o culto, ou toque no nome e depois no lugar.' : 'Arraste um nome para a escala, ou clique no nome e depois no lugar.'}</span></div>
      <div class="pal-abas" role="tablist">${[['min', 'Ministros'], ['bac', 'Back vocal'], ['mus', 'Músicos']].map(g => html`<button type="button" role="tab" data-a="palGrupo" data-g="${g[0]}" aria-selected="${palGrupo === g[0]}">${g[1]}</button>`)}</div>
      <input type="search" data-i="palBusca" placeholder="Buscar nome…" aria-label="Buscar nome">
      <p class="pal-leg">Entre parênteses: escalas da pessoa neste mês.</p>
      <div class="pal-sec ${palGrupo === 'min' ? 'on' : ''}" data-g="min">${grupo('Ministros', ativos.filter(p => p.ministro).map(p => pc(p)))}</div>
      <div class="pal-sec ${palGrupo === 'bac' ? 'on' : ''}" data-g="bac">${grupo('Back vocal', ativos.filter(p => p.back).map(p => pc(p, '', p.voz)))}</div>
      <div class="pal-sec ${palGrupo === 'mus' ? 'on' : ''}" data-g="mus">${instrs.length ? instrs.map(i => grupo(i.nome, ativos.filter(p => p.musico && p.instrumentos.indexOf(i.id) >= 0).map(p => pc(p, i.id, toque ? i.nome : '')))) : grupo('Músicos', [])}</div>
      <p class="esc-dica">Para tirar alguém, use o × ao lado do nome. ${pode('pessoas.editar') ? html`Faltou alguém? <a href="#/pessoa/nova">Cadastrar pessoa</a>.` : ''}</p>`;
  };
  const desenhar = () => {
    const tb = $('#escCorpo');
    if (!tb) return;
    tb.innerHTML = v_(linhas());
    desenharPaleta();
    const n = rascunhos().length;
    const bp = $('#btnPub');
    if (bp) { bp.disabled = !n; bp.textContent = n ? 'Publicar ' + n + (n === 1 ? ' rascunho' : ' rascunhos') : 'Tudo publicado'; }
    marcarAlvos();
  };
  const desenharPaleta = () => {
    const p = $('#paleta'); if (!p) return;
    const qv = ($('[data-i=palBusca]', p) || {}).value || '';

      : html`<div class="vazio">Nenhum compromisso neste mês.</div>`;
    const m = modal({ titulo: 'Compromissos de ' + MESES[EF.mes - 1], larga: true, corpo: html`
      <p class="muted">Datas em que a pessoa não pode servir. Ao escalar, esses cultos aparecem em vermelho com ✕ para ela.</p>
      <div class="card" style="margin-bottom:14px"><div class="linha">
        <label class="campo"><span>Pessoa</span><select name="cp"><option value="">Escolha…</option>${S.base.pessoas.filter(p => p.ativo).map(p => html`<option value="${p.id}" ${p.id === EF.destaque ? raw('selected') : ''}>${p.nome}</option>`)}</select></label>
        <label class="campo"><span>Data</span><input type="date" name="cde" value="${EF.ano}-${String(EF.mes).padStart(2, '0')}-01"></label>
        <label class="campo"><span>Até (se for um período)</span><input type="date" name="cate"></label></div>
        <label class="campo"><span>Motivo (opcional)</span><input type="text" name="cmot" maxlength="200" placeholder="Ex.: viagem, plantão no trabalho"></label>
        <div class="acoes"><button class="btn pri" data-a="compSalvar">Adicionar compromisso</button><button class="btn leve" data-a="compCancEd" hidden>Cancelar alteração</button></div></div>
      <div id="compLista">${lista()}</div>` });
    let editando = '';
    const modoEdicao = id => {
      editando = id || '';
      $('[data-a=compSalvar]', m.el).textContent = editando ? 'Salvar alteração' : 'Adicionar compromisso';
      $('[data-a=compCancEd]', m.el).hidden = !editando;
      if (!editando) { $('[name=cmot]', m.el).value = ''; $('[name=cate]', m.el).value = ''; }
    };
    A.compEd = el => {
      const c = M.compromissos.find(x => x.id === el.dataset.id); if (!c) return;
      $('[name=cp]', m.el).value = c.pessoaId; $('[name=cde]', m.el).value = c.de; $('[name=cate]', m.el).value = c.ate !== c.de ? c.ate : ''; $('[name=cmot]', m.el).value = c.motivo || '';
      modoEdicao(c.id); $('[name=cp]', m.el).focus();
    };
    A.compCancEd = () => modoEdicao('');
    A.compSalvar = async () => {
      const dados = { pessoaId: $('[name=cp]', m.el).value, de: $('[name=cde]', m.el).value, ate: $('[name=cate]', m.el).value, motivo: $('[name=cmot]', m.el).value };
      const r = editando ? await api('compromissos.editar', Object.assign({ id: editando }, dados)) : await api('compromissos.salvar', dados);
      const eraEdicao = !!editando; modoEdicao('');
      const nd = await api('escalas.mes', { ano: EF.ano, mes: EF.mes }); M.compromissos = nd.compromissos;
      $('#compLista', m.el).innerHTML = v_(lista()); $('[name=cmot]', m.el).value = ''; $('[name=cate]', m.el).value = '';
      toast(eraEdicao ? 'Compromisso alterado.' : 'Compromisso adicionado.', 'ok'); (r.avisos || []).forEach(a => toast(a, 'erro')); desenhar();
      const b = $('[data-a=compAbrir]'); if (b) b.textContent = 'Compromissos (' + M.compromissos.length + ')';
    };
    A.compExc = async el => {
      await api('compromissos.excluir', { id: el.dataset.id });
      M.compromissos = M.compromissos.filter(c => c.id !== el.dataset.id);
      $('#compLista', m.el).innerHTML = v_(lista()); toast('Compromisso excluído.', 'ok'); desenhar();
      const b = $('[data-a=compAbrir]'); if (b) b.textContent = 'Compromissos' + (M.compromissos.length ? ' (' + M.compromissos.length + ')' : '');
    };
  };
  A.pdfMes = () => pdfOpcoes({ tipo: 'mes', ano: EF.ano, mes: EF.mes, destaque: EF.destaque }, 'baixar');
  A.imprimirMes = () => pdfOpcoes({ tipo: 'mes', ano: EF.ano, mes: EF.mes, destaque: EF.destaque }, 'imprimir');
}

function pdfOpcoes(params, modo) {
  if (!pode('escalas.editar')) return gerarPdf(params, modo);
  modal({ titulo: modo === 'imprimir' ? 'Imprimir escala' : 'Gerar PDF', corpo: html`<p>Por padrão, o documento traz apenas as escalas <b>publicadas</b>.</p>
    <label class="check"><input type="checkbox" name="r"> Incluir rascunhos (marcados como RASCUNHO)</label>
    <label class="check"><input type="checkbox" name="c"> Incluir cultos cancelados</label>`,
    botoes: [{ t: 'Cancelar' }, { t: modo === 'imprimir' ? 'Imprimir' : 'Baixar PDF', cls: 'pri', a: el => gerarPdf(Object.assign({ incluirRascunhos: $('[name=r]', el).checked, incluirCancelados: $('[name=c]', el).checked }, params), modo) }] });
}

/* ======================== Culto (ver / editar) ======================== */
async function telaCulto(pg, id) {

  const ed = pode('escalas.editar');

    <div class="cab"><div class="tit"><div class="culto-tit" style="margin:0"><h1>${c.titulo}</h1><span class="st ${c.status}">${ST[c.status]}</span></div>

  if (!ed) {

      <section class="bloco"><h2>Músicas</h2>${musicasLeitura(c.musicas)}</section>
      ${c.obs ? html`<section class="bloco"><h2>Observações</h2><div class="card" style="white-space:pre-wrap">${c.obs}</div></section>` : ''}`.s;
    return;
  }
  // ---- Editor ----
  const E = {
    qtd: c.qtdMinistros, horario: c.horario, nome: c.nome, obs: c.obs, versao: c.atualizadoEm, sujo: false,
    ministros: c.ministros.map(i => i.pessoaId), backs: c.backs.map(i => i.pessoaId),
    musicos: c.musicos.map(i => ({ pessoaId: i.pessoaId, instrumentoId: i.instrumentoId })),
    musicas: c.musicas.map(m => ({ musicaId: m.musicaId, titulo: m.titulo, link: m.musicaId ? '' : m.link, tom: m.tom, tomOriginal: m.tomOriginal })),
    excecoes: [].concat(c.ministros, c.backs, c.musicos).filter(i => i.excecao).map(i => i.nome + ': ' + i.excecao),
  };
  while (E.ministros.length < E.qtd) E.ministros.push('');
  const sujo = () => { E.sujo = true; saidaPendente = () => confirmar('Há alterações não salvas nesta escala. Sair mesmo assim?', 'Sair sem salvar', true); };
  const instrAtivos = S.base.instrumentos.filter(i => i.ativo !== 'FALSE');
  const essenciais = String(S.base.config.instrumentosEssenciais || '').split(',').map(s => norm(s.trim())).filter(Boolean);
  const pendLocais = () => {
    const p = [];
    const fm = E.qtd - E.ministros.filter(Boolean).length; if (fm > 0) p.push(fm === 1 ? 'Falta 1 ministro' : 'Faltam ' + fm + ' ministros');
    if (!E.backs.filter(Boolean).length) p.push('Nenhum back escalado');
    const ms = E.musicos.filter(m => m.pessoaId);
    if (!ms.length) p.push('Nenhum músico escalado');
    else essenciais.forEach(e => { if (!ms.some(m => norm(INS(m.instrumentoId).nome) === e)) p.push('Sem ' + e); });
    if (E.musicos.some(m => !m.pessoaId)) p.push('Há vaga de músico sem pessoa (será ignorada)');
    return p;
  };
  const slot = (pid, attrs, vazio, extra) => html`<div class="slot">${pid ? html`<span class="nome">${P(pid).nome}${P(pid).ativo ? '' : ' (inativo)'}</span>` : html`<span class="nome vz">${vazio}</span>`}
    ${extra || ''}<button class="btn peq" data-a="${attrs.trocar}" data-k="${attrs.k}">${pid ? 'Trocar' : 'Escolher'}</button>${attrs.remover ? html`<button class="btn leve peq" data-a="${attrs.remover}" data-k="${attrs.k}" aria-label="Remover">✕</button>` : ''}</div>`;
  const desenhar = () => {
    const pend = pendLocais();
    $('#ed').innerHTML = html`
      <div class="card"><div class="linha">
        <label class="campo"><span>Horário</span><input type="time" value="${E.horario}" data-i="eHora"></label>
        <label class="campo"><span>Nome (opcional)</span><input type="text" value="${E.nome}" maxlength="80" data-i="eNome" placeholder="${c.tipoCultoId ? (S.base.tiposCulto.find(t => t.id === c.tipoCultoId) || {}).nome : ''}"></label>
      </div>${pend.length ? html`<div class="pend">${pend.map(p => html`<span>${p}</span>`)}</div>` : html`<div class="pend"><span class="info">Todas as funções preenchidas</span></div>`}</div>

      <section class="bloco"><div class="funcao-cab"><h3>Quem está escalado</h3><a class="btn peq" href="${mesHref}">Mudar pessoas na escala do mês</a></div>
        <div class="card">${equipeHtml(c, S.base.me.pessoaId)}</div></section>
      ${presencaCultoHtml(c)}
      <section class="bloco"><div class="funcao-cab"><h3>Músicas do culto</h3><button class="btn peq" data-a="eMusicaAdd">+ Adicionar música</button></div>
        ${E.musicas.length ? E.musicas.map((m, k) => html`<div class="slot"><span class="ord"><button data-a="eMusicaUp" data-k="${k}" aria-label="Subir">▲</button><button data-a="eMusicaDown" data-k="${k}" aria-label="Descer">▼</button></span>
          <span class="nome">${k + 1}. ${m.titulo}</span>
          <input type="text" value="${m.tom}" placeholder="${m.tomOriginal ? 'Tom ' + m.tomOriginal : 'Tom'}" data-i="eMusicaTom" data-k="${k}" style="width:80px;min-height:38px;padding:6px" aria-label="Tom neste culto">
          <button class="btn leve peq" data-a="eMusicaX" data-k="${k}" aria-label="Remover">✕</button></div>`) : html`<div class="vazio">Nenhuma música definida.</div>`}</section>

      <section class="bloco"><label class="campo"><span>Observações</span><textarea data-i="eObs" maxlength="2000">${E.obs}</textarea></label></section>
      ${E.excecoes.length ? html`<div class="aviso"><b>Exceções de horário confirmadas</b><ul>${E.excecoes.map(x => html`<li>${x}</li>`)}</ul></div>` : ''}
      <div class="meta">Criada por ${c.criadoPor || '—'} em ${fmtQuando(c.criadoEm)} · última alteração por ${c.atualizadoPor || '—'} em ${fmtQuando(c.atualizadoEm)}${c.publicadoEm ? ' · publicada por ' + c.publicadoPor + ' em ' + fmtQuando(c.publicadoEm) : ''}</div>`.s;
  };
  pg.innerHTML = html`${cabecalho}<div id="ed"></div>
    <div class="barra-salvar">
      ${c.status !== 'CANCELADA' ? html`<button class="btn perigo" data-a="eStatus" data-s="CANCELADA">Cancelar culto</button>` : html`<button class="btn" data-a="eStatus" data-s="RASCUNHO">Reativar como rascunho</button>`}
      <button class="btn perigo" data-a="eExcluir">Excluir</button>
      ${c.status === 'PUBLICADA' ? html`<button class="btn" data-a="eStatus" data-s="RASCUNHO">Voltar para rascunho</button>` : ''}
      <button class="btn" data-a="eSalvar">Salvar</button>
      ${c.status === 'RASCUNHO' ? html`<button class="btn pri" data-a="eSalvar" data-pub="1">Salvar e publicar</button>` : ''}
    </div>`.s;
  desenhar();
  const usadosEm = f => f === 'MINISTRO' ? E.ministros : f === 'BACK' ? E.backs : E.musicos.map(m => m.pessoaId);
  A.eHora = el => { E.horario = el.value; sujo(); };
  A.eNome = el => { E.nome = el.value; sujo(); };
  A.eObs = el => { E.obs = el.value; sujo(); };
  A.eQtd = el => { E.qtd = Number(el.dataset.n); while (E.ministros.length < E.qtd) E.ministros.push(''); if (E.ministros.length > E.qtd) { const cheios = E.ministros.filter(Boolean); E.ministros = cheios.slice(0, E.qtd); while (E.ministros.length < E.qtd) E.ministros.push(''); if (cheios.length > E.qtd) toast('Ministros excedentes foram removidos.'); } sujo(); desenhar(); };
  A.eMin = async el => { const k = Number(el.dataset.k); const p = await escolherPessoa({ titulo: 'Escolher ministro', filtro: x => x.ministro, bloqueados: E.ministros.filter((x, i) => x && i !== k), motivo: 'já está como ministro' }); if (p) { E.ministros[k] = p.id; sujo(); desenhar(); } };
  A.eMinX = el => { E.ministros[Number(el.dataset.k)] = ''; sujo(); desenhar(); };
  A.eBackAdd = async () => { const p = await escolherPessoa({ titulo: 'Adicionar back', filtro: x => x.back, bloqueados: E.backs, motivo: 'já está como back' }); if (p) { E.backs.push(p.id); sujo(); desenhar(); } };
  A.eBack = async el => { const k = Number(el.dataset.k); const p = await escolherPessoa({ titulo: 'Escolher back', filtro: x => x.back, bloqueados: E.backs.filter((x, i) => i !== k), motivo: 'já está como back' }); if (p) { E.backs[k] = p.id; sujo(); desenhar(); } };
  A.eBackX = el => { E.backs.splice(Number(el.dataset.k), 1); sujo(); desenhar(); };
  const escolherMusico = (insId, k) => escolherPessoa({ titulo: 'Escolher ' + INS(insId).nome.toLowerCase(), filtro: x => x.musico && x.instrumentos.indexOf(insId) >= 0,
    bloqueados: E.musicos.filter((m, i) => i !== k).map(m => m.pessoaId).filter(Boolean), motivo: 'já está como músico' });
  A.eMusAdd = async el => { const ins = el.dataset.ins; const p = await escolherMusico(ins, -1); if (p) { E.musicos.push({ pessoaId: p.id, instrumentoId: ins }); sujo(); desenhar(); } };
  A.eMus = async el => { const k = Number(el.dataset.k); const p = await escolherMusico(E.musicos[k].instrumentoId, k); if (p) { E.musicos[k].pessoaId = p.id; sujo(); desenhar(); } };
  A.eMusX = el => { E.musicos.splice(Number(el.dataset.k), 1); sujo(); desenhar(); };
  A.eMusIns = el => { const m = E.musicos[Number(el.dataset.k)]; m.instrumentoId = el.value; if (m.pessoaId && P(m.pessoaId).instrumentos.indexOf(el.value) < 0) { toast(P(m.pessoaId).nome + ' não toca ' + INS(el.value).nome + '; escolha outra pessoa.'); m.pessoaId = ''; } sujo(); desenhar(); };
  A.eMusicaAdd = async () => { const m = await escolherMusica(E.musicas.map(x => x.musicaId)); if (m) { E.musicas.push({ musicaId: m.id, titulo: m.nome, tom: '', tomOriginal: m.tom }); sujo(); desenhar(); } };
  const mover = (k, d) => { const j = k + d; if (j < 0 || j >= E.musicas.length) return; const t = E.musicas[k]; E.musicas[k] = E.musicas[j]; E.musicas[j] = t; sujo(); desenhar(); };
  A.eMusicaUp = el => mover(Number(el.dataset.k), -1);
  A.eMusicaDown = el => mover(Number(el.dataset.k), 1);
  A.eMusicaX = el => { E.musicas.splice(Number(el.dataset.k), 1); sujo(); desenhar(); };
  A.eMusicaTom = el => { E.musicas[Number(el.dataset.k)].tom = el.value; sujo(); };
  const payload = conf => ({
    id: c.id, versao: E.versao, qtdMinistros: E.qtd, horario: E.horario, nome: E.nome, obs: E.obs, confirmarConflitos: !!conf,
    itens: [].concat(E.ministros.filter(Boolean).map(p => ({ pessoaId: p, funcao: 'MINISTRO' })), E.backs.filter(Boolean).map(p => ({ pessoaId: p, funcao: 'BACK' })),
      E.musicos.filter(m => m.pessoaId).map(m => ({ pessoaId: m.pessoaId, funcao: 'MUSICO', instrumentoId: m.instrumentoId }))),
    musicas: E.musicas.map(m => ({ musicaId: m.musicaId, titulo: m.titulo, link: m.link, tom: m.tom })),
  });
  const salvar = async (publicar, conf) => {
    let r;
    try { r = await api('escalas.salvar', payload(conf)); }
    catch (e) {
      if (e.code === 'CONFLITO' || (e.code === 'PERMISSAO' && e.info && e.info.validacao)) {
        const lista = e.info.validacao.conflitos;
        const lider = pode('escalas.excecao');
        return modal({ titulo: 'Conflito de horário', corpo: html`<p>Estas pessoas já têm outra atividade no mesmo horário:</p>
          <ul>${lista.map(x => html`<li><b>${x.nome}</b> — ${x.com}</li>`)}</ul>
          ${lider ? html`<p>Como liderança, você pode salvar mesmo assim. A exceção ficará registrada com seu nome.</p>` : html`<div class="aviso">Somente a liderança pode confirmar exceções. Troque as pessoas ou peça a um líder.</div>`}`,
          botoes: lider ? [{ t: 'Revisar escala' }, { t: 'Salvar com exceção', cls: 'pri', a: () => { salvar(publicar, true); } }] : [{ t: 'Entendi' }] });
      }
      if (e.code === 'VALIDACAO') return modal({ titulo: 'Corrija antes de salvar', corpo: html`<ul>${(e.info.validacao ? e.info.validacao.erros : [e.message]).map(x => html`<li>${x}</li>`)}</ul>`, botoes: [{ t: 'Ok' }] });
      throw e;
    }
    E.sujo = false; saidaPendente = null; E.versao = r.culto.atualizadoEm;
    if (r.avisos && r.avisos.length) toast(r.avisos.join(' '));
    if (publicar) {
      const avisos = r.culto.pendencias.filter(p => p.nivel === 'aviso');
      if (avisos.length && !(await confirmar(html`A escala foi salva, mas ainda tem pendências: ${avisos.map(p => p.texto).join(', ')}. Publicar mesmo assim?`, 'Publicar'))) return rota();
      await api('escalas.status', { id: c.id, status: 'PUBLICADA' });
      toast('Escala publicada.', 'ok');
    } else toast('Escala salva.', 'ok');
    rota();
  };
  A.eSalvar = el => salvar(!!el.dataset.pub, false);
  A.eStatus = async el => {
    const s = el.dataset.s;
    if (E.sujo) return toast('Salve as alterações antes de mudar o status.', 'erro');
    if (s === 'CANCELADA' && !(await confirmar('Marcar este culto como cancelado? Ele continua no histórico e deixa de gerar conflitos de horário.', 'Cancelar culto', true))) return;
    await api('escalas.status', { id: c.id, status: s });
    toast(s === 'CANCELADA' ? 'Culto cancelado.' : 'Escala voltou para rascunho.', 'ok'); rota();
  };
  A.eExcluir = async () => {
    if (!(await confirmar('Excluir este culto e a escala dele? Esta ação não pode ser desfeita. Para manter o histórico, prefira “Cancelar culto”.', 'Excluir', true))) return;
    await api('escalas.excluir', { id: c.id }); saidaPendente = null; toast('Culto excluído.', 'ok'); location.hash = mesHref;
  };
}
/** Presença no culto: cumpriu a escala, faltou ou justificou (liderança e quem tem permissão de presença). */
const PC = { SIM: 'Cumpriu', NAO: 'Faltou', JUST: 'Justificou' };
function presencaCultoHtml(c) {
  if (!pode('presenca.registrar') || c.status === 'CANCELADA') return '';
  const pessoas = [];
  [].concat(c.ministros, c.backs, c.musicos).forEach(i => {
    let p = pessoas.find(x => x.pessoaId === i.pessoaId);
    if (!p) pessoas.push(p = { pessoaId: i.pessoaId, nome: i.nome, funcoes: [], presenca: i.presenca, justificativa: i.justificativa });
    p.funcoes.push(i.funcao === 'MUSICO' ? i.instrumento : FUNC[i.funcao].n);
  });
  if (!pessoas.length) return '';
  const conf = c.presencaConferida;
  return html`<section class="bloco" id="presCulto"><div class="funcao-cab"><h3>Presença no culto</h3>
      ${conf ? html`<span class="muted peq">Conferido por ${conf.por} em ${fmtQuando(conf.em)}</span>` : html`<span class="st RASCUNHO">não conferido</span>`}</div>
    <div class="lista">${pessoas.map(p => { const v = p.presenca || 'SIM';
      return html`<div class="pres pc" data-p="${p.pessoaId}" data-v="${v}"><div><b>${p.nome}</b><div class="sub peq muted">${p.funcoes.join(' · ')}</div></div>
        <div class="seg" role="group" aria-label="Presença de ${p.nome}">${['SIM', 'NAO', 'JUST'].map(k => html`<button type="button" class="${v === k ? 'on ' + k : ''}" data-a="pcSet" data-v="${k}" aria-pressed="${v === k}">${PC[k]}</button>`)}</div>
        <input class="just" type="text" placeholder="Motivo (opcional)" value="${p.justificativa || ''}" ${v === 'JUST' ? '' : raw('hidden')} maxlength="300"></div>`; })}</div>
    <p class="muted peq">Todos começam como “Cumpriu”. Marque quem faltou ou justificou e salve. Isso aparece no histórico e no ranking de Relatórios.</p>
    <div class="acoes"><button class="btn pri" data-a="pcSalvar" data-id="${c.id}">${conf ? 'Atualizar presença' : 'Salvar presença'}</button>${conf ? html`<button class="btn leve" data-a="pcLimpar" data-id="${c.id}">Apagar registro</button>` : ''}</div></section>`;
}
A.pcSet = el => {
  const linha = el.closest('.pc'); linha.dataset.v = el.dataset.v;
  $$('button', linha).forEach(b => { const on = b.dataset.v === el.dataset.v; b.className = on ? 'on ' + b.dataset.v : ''; b.setAttribute('aria-pressed', on); });
  const j = $('.just', linha); j.hidden = el.dataset.v !== 'JUST'; if (!j.hidden) j.focus();

const NOTAS = [['C', 'Dó'], ['C#', 'Dó♯'], ['D', 'Ré'], ['Eb', 'Mi♭'], ['E', 'Mi'], ['F', 'Fá'], ['F#', 'Fá♯'], ['G', 'Sol'], ['Ab', 'Lá♭'], ['A', 'Lá'], ['Bb', 'Si♭'], ['B', 'Si']];
const EQUIV = { 'C#': 1, 'DB': 1, 'D#': 3, 'EB': 3, 'F#': 6, 'GB': 6, 'G#': 8, 'AB': 8, 'A#': 10, 'BB': 10, C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function lerTom(t) {
  const m = String(t || '').trim().match(/^([A-Ga-g])([#b♯♭]?)(m?)/);
  if (!m) return null;
  const k = (m[1].toUpperCase() + m[2].replace('♯', '#').replace('♭', 'b')).toUpperCase();
  const i = EQUIV[k]; if (i === undefined) return null;
  return { i, menor: !!m[3], cifra: NOTAS[i][0] + (m[3] ? 'm' : ''), nome: NOTAS[i][1] + (m[3] ? ' menor' : ' maior') };
}
function diferencaTom(meu, orig) {
  const a = lerTom(meu), b = lerTom(orig);
  if (!a || !b) return '';
  let d = (a.i - b.i + 12) % 12; if (d > 6) d -= 12;
  if (d === 0) return 'Mesmo tom do original';
  const n = Math.abs(d);
  const tons = n === 1 ? 'meio tom' : (n / 2).toString().replace('.', ',') + (n === 2 ? ' tom' : ' tons');
  return n + (n === 1 ? ' semitom' : ' semitons') + ' (' + tons + ') ' + (d > 0 ? 'acima' : 'abaixo') + ' do original';
}
const ST_MUS = { '': 'Sem status', ENSAIANDO: 'Ensaiando', ENSAIADA: 'Ensaiada' };
const stMus = st => st ? html`<span class="st-mus ${st}">${ST_MUS[st]}</span>` : '';
function abasPlaylist(ativa) {

}
function selectTom(nome, valor) {
  const atual = lerTom(valor);
  const op = [];
  NOTAS.forEach((n, i) => { op.push([n[0], n[0] + ' · ' + n[1] + ' maior']); });
  NOTAS.forEach((n, i) => { op.push([n[0] + 'm', n[0] + 'm · ' + n[1] + ' menor']); });
  return html`<select data-c="mTom" data-k="${nome}"><option value="">Não definido</option>${op.map(o => html`<option value="${o[0]}" ${atual && atual.cifra === o[0] ? raw('selected') : ''}>${o[1]}</option>`)}</select>`;
}

const AUDIO_URL = {};
let gravacao = null;
const AUDIO_MAX = 12 * 1024 * 1024;
async function telaMusicaVer(pg, id) {

    return html`<div class="voz-bloco"><div class="voz-cab"><b>${v} <span class="muted">${la.length ? '· ' + la.length + (la.length === 1 ? ' áudio' : ' áudios') : ''}</span></b>
      ${envia ? html`<span class="acoes"><button class="btn peq" data-a="audGravar" data-v="${v}">Gravar</button><button class="btn peq" data-a="audEnviar" data-v="${v}">Enviar arquivo</button></span>` : ''}</div>
      ${la.length ? la.map(a => html`<div class="audio-item" data-aud="${a.id}"><button class="play" data-a="audTocar" data-id="${a.id}" aria-label="Ouvir ${a.nome}">▶</button>

        ${envia ? html`<button class="ic" data-a="audRen" data-id="${a.id}" aria-label="Renomear ${a.nome}" title="Renomear">✎</button><button class="ic" data-a="audExc" data-id="${a.id}" aria-label="Excluir ${a.nome}" title="Excluir">×</button>` : ''}
        <div class="player"></div></div>`) : html`<p class="muted peq" style="margin:6px 0 0">Nenhum áudio ainda.</p>`}</div>`; });
  const temPartes = d.partes.length;
  const usadas = {}; d.partes.forEach(p => p.vozes.forEach(v => { usadas[v.voz] = 1; }));
  const cols = vozes.filter(v => usadas[v]);   // mesma ordem dos tipos de voz

  pg.innerHTML = html`${voltar('#/musicas', 'Playlist')}

    <div class="tom-grande">
      <div class="tom-principal"><span class="rot-tom">Tom do ministério</span><strong>${tom ? tom.cifra : '?'}</strong><span>${tom ? tom.nome : 'Tom não definido'}</span></div>

    </div>
    ${tom && orig ? html`<p class="muted peq" style="margin:0">${diferencaTom(m.tom, m.tomOriginal)}</p>` : ''}
    <div class="acoes" style="margin-top:14px" id="stBox">${(pode('musicas.editar') || pode('ensaios.editar')) ? html`<span class="muted peq">Situação no ensaio:</span>${['', 'ENSAIANDO', 'ENSAIADA'].map(k => html`<button class="tog" data-a="mStatus" data-v="${k}" aria-pressed="${(m.status || '') === k}">${ST_MUS[k]}</button>`)}` : stMus(m.status)}</div>
    <h2 class="secao">Áudios por voz</h2>
    ${envia ? html`<p class="muted peq" style="margin-top:-4px">Grave ou envie a referência de cada voz. No celular, “Enviar arquivo” também abre o gravador do aparelho.</p>` : ''}
    <div id="vozes"></div><input type="file" id="audArq" accept="audio/*" hidden>
    ${m.obs ? html`<h2 class="secao">Como cantar</h2><p class="texto-livre">${m.obs}</p>` : ''}
    ${m.letra ? html`<h2 class="secao">Letra</h2><p class="texto-livre" style="font-size:1.05rem;line-height:1.7">${m.letra}</p>` : ''}`.s;
  desenharAudios();

  A.mStatus = async el => { const r = await api('musicas.status', { id: m.id, status: el.dataset.v }); m.status = r.status; S.musicas = null;
    $$('#stBox [data-a=mStatus]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === r.status)); toast('Situação: ' + ST_MUS[r.status] + '.', 'ok'); };
  let vozAlvo = '';
  const guardar = async (blob, nome) => {
    if (blob.size > AUDIO_MAX) return toast('Áudio grande demais (máximo 12 MB). Grave um trecho menor.', 'erro');
    toast('Enviando o áudio…');
    const b64 = await new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => err(r.error); r.readAsDataURL(blob); });
    const r = await api('audios.salvar', { musicaId: m.id, voz: vozAlvo, nome: nome || '', mime: blob.type || 'audio/webm', base64: b64 });
    AUDIO_URL[r.id] = URL.createObjectURL(blob);
    audios = r.audios; desenharAudios(); toast('Áudio salvo.', 'ok');
  };
  A.audEnviar = el => { vozAlvo = el.dataset.v; const i = $('#audArq'); i.value = ''; i.click(); };
  $('#audArq').addEventListener('change', e => { const f = e.target.files[0]; if (f) guardar(f, f.name.replace(/\.[^.]+$/, '').slice(0, 100)).catch(falha); });
  A.audGravar = async el => {
    if (gravacao) { gravacao.rec.stop(); return; }
    vozAlvo = el.dataset.v;
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este aparelho não grava por aqui. Use “Enviar arquivo”.', 'erro');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return toast('O microfone não foi liberado. Permita o microfone ou use “Enviar arquivo”.', 'erro'); }
    const rec = new MediaRecorder(stream), partes = [], inicio = Date.now();
    rec.ondataavailable = ev => { if (ev.data && ev.data.size) partes.push(ev.data); };
    rec.onstop = () => {
      clearInterval(gravacao && gravacao.relogio); stream.getTracks().forEach(t => t.stop()); gravacao = null;
      el.classList.remove('gravando'); el.textContent = 'Gravar';
      const blob = new Blob(partes, { type: rec.mimeType || 'audio/webm' });
      if (blob.size) guardar(blob).catch(falha);
    };
    rec.start();
    el.classList.add('gravando');
    gravacao = { rec, relogio: setInterval(() => { const s = Math.floor((Date.now() - inicio) / 1000); el.textContent = 'Parar ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 600) rec.stop(); }, 500) };
  };
  A.audTocar = async el => {
    const id = el.dataset.id, pl = el.closest('.audio-item').querySelector('.player');
    const au = pl.querySelector('audio');
    if (au) { if (au.paused) au.play(); else au.pause(); return; }
    el.textContent = '…';
    try {
      if (!AUDIO_URL[id]) {
        const r = await api('audios.ler', { id });
        const bin = atob(r.base64), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        AUDIO_URL[id] = URL.createObjectURL(new Blob([u8], { type: r.mime || 'audio/webm' }));
      }
      pl.innerHTML = '<audio controls></audio>';
      const a = pl.querySelector('audio'); a.src = AUDIO_URL[id]; a.play().catch(() => {});
    } finally { el.textContent = '▶'; }
  };
  A.audRen = el => { const a = audios.find(x => x.id === el.dataset.id);
    modal({ titulo: 'Renomear áudio', corpo: html`<label class="campo"><span>Nome</span><input type="text" name="n" value="${a.nome}" maxlength="100"></label>
      <label class="campo"><span>Voz</span><select name="v">${vozes.map(v => html`<option ${v === a.voz ? raw('selected') : ''}>${v}</option>`)}</select></label>`,
      botoes: [{ t: 'Cancelar' }, { t: 'Salvar', cls: 'pri', a: async md => { const r = await api('audios.renomear', { id: a.id, nome: $('[name=n]', md).value, voz: $('[name=v]', md).value }); audios = r.audios; desenharAudios(); toast('Áudio atualizado.', 'ok'); } }] }); };
  A.audExc = async el => { const a = audios.find(x => x.id === el.dataset.id);

}

      <div class="picker-lista" style="padding:4px 12px">${candidatos.map(x => html`<label class="check" data-n="${norm(x.nome)}"><input type="checkbox" name="p" value="${x.id}" ${atuais.some(v => v.pessoaId === x.id) ? raw('checked') : ''}> ${x.nome}</label>`)}
      ${candidatos.length ? '' : html`<p class="muted">Cadastre ministros ou backs em Pessoas.</p>`}</div>`,
      botoes: [{ t: 'Cancelar' }, { t: 'Aplicar', cls: 'pri', a: m => {
        const ids = $$('[name=p]:checked', m).map(i => i.value);
        p.vozes = p.vozes.filter(v => v.voz !== voz);
        if (ids.length) ids.forEach(pid => p.vozes.push({ voz, pessoaId: pid }));
        else if ($('[name=marca]', m).checked) p.vozes.push({ voz, pessoaId: '' });
        sujo(); desenhar();
      } }] });
    const m = $$('.fundo').pop();
    $('[name=f]', m).addEventListener('input', e => $$('[data-n]', m).forEach(l => { l.style.display = l.dataset.n.indexOf(norm(e.target.value)) >= 0 ? '' : 'none'; }));
    $$('[name=p]', m).forEach(c => c.addEventListener('change', () => { if (c.checked) $('[name=marca]', m).checked = true; }));
  };
  A.mSalvar = async () => {
    const r = await api('musicas.salvar', { musica: M });
    saidaPendente = null; S.musicas = null; toast('Música salva.', 'ok');
    location.hash = '#/musica/' + r.musica.id;
  };
  A.mArq = async () => {
    if (M.ativo && !(await confirmar('Arquivar esta música? Ela some das listas de escolha, mas continua nas escalas antigas.', 'Arquivar', true))) return;
    await api('musicas.arquivar', { id: M.id, ativo: !M.ativo }); S.musicas = null; saidaPendente = null; toast(M.ativo ? 'Música arquivada.' : 'Música reativada.', 'ok'); location.hash = M.ativo ? '#/musicas' : '#/musica/' + M.id;
  };
}

const PF = { funcoes: [], instrumentos: [], status: 'ativos', busca: '' };
async function telaPessoas(pg) {
  if (!pode('pessoas.editar')) { pg.innerHTML = html`<div class="aviso erro">Esta área é da liderança.</div>`.s; return; }
  await recarregarBase();
  const ed = pode('pessoas.editar');
  const desenhar = () => {
    let l = S.base.pessoas;
    if (PF.status === 'ativos') l = l.filter(p => p.ativo); else if (PF.status === 'inativos') l = l.filter(p => !p.ativo);
    if (PF.funcoes.length) l = l.filter(p => PF.funcoes.some(f => (f === 'MINISTRO' && p.ministro) || (f === 'MINBACK' && p.ministro && p.back) || (f === 'BACK' && p.back) || (f === 'MUSICO' && p.musico)));
    if (PF.instrumentos.length) l = l.filter(p => PF.instrumentos.some(i => p.instrumentos.indexOf(i) >= 0));
    if (PF.busca) l = l.filter(p => norm(p.nome).indexOf(norm(PF.busca)) >= 0);
    $('#lp').innerHTML = v_(l.length ? html`<div class="lista">${l.map(p => html`<${ed ? 'a' : 'div'} class="item" ${ed ? raw('href="#/pessoa/' + esc(p.id) + '"') : ''}>
      <span class="cresce"><b>${p.nome}${p.ativo ? '' : ' (inativo)'}${p.exemplo ? ' — exemplo' : ''}</b><span class="sub">${p.musico && p.instrumentos.length ? p.instrumentos.map(i => INS(i).nome).join(', ') : ''}${p.usuario ? (p.musico && p.instrumentos.length ? ' · ' : '') + 'login: ' + p.usuario.login + (p.usuario.perfil !== 'MEMBRO' ? ' (' + ROT_PERFIL[p.usuario.perfil].toLowerCase() + ')' : '') : ''}</span></span>
      <span class="acoes" style="gap:4px">${p.ministro ? html`<span class="chip min">Ministro(a)</span>` : ''}${p.back ? html`<span class="chip bac">Back</span>` : ''}${p.musico ? html`<span class="chip mus">Músico</span>` : ''}</span></${ed ? 'a' : 'div'}>`)}</div>`
      : html`<div class="vazio">${S.base.pessoas.length ? 'Ninguém corresponde aos filtros.' : 'Nenhuma pessoa cadastrada ainda.'}</div>`);
    const at = S.base.pessoas.filter(p => p.ativo);
    const n = f => at.filter(f).length;
    $('#np').innerHTML = v_(html`<span class="resumo"><b>${at.length}</b> ativas · <b>${n(p => p.ministro && p.back)}</b> ministro/back · <b>${n(p => p.ministro && !p.back)}</b> só ministro(a) · <b>${n(p => p.back && !p.ministro)}</b> só back · <b>${n(p => p.musico)}</b> músicos${l.length !== at.length ? html` · mostrando ${l.length}` : ''}</span>`);
  };
  pg.innerHTML = html`<div class="cab"><div class="tit"><h1>Pessoas</h1><p id="np"></p></div>${ed ? html`<a class="btn pri" href="#/pessoa/nova">+ Nova pessoa</a>` : ''}</div>
    <div class="filtros">
      <label class="campo"><span>Buscar</span><input type="search" data-i="pB" value="${PF.busca}" placeholder="Nome"></label>
      <div class="filtro-grupo"><span>Como serve</span><div class="togs">${[['MINISTRO', 'Ministro(a)'], ['MINBACK', 'Ministro/back'], ['BACK', 'Back vocal'], ['MUSICO', 'Músico']].map(f => html`<button type="button" class="tog" data-a="pFT" data-v="${f[0]}" aria-pressed="${PF.funcoes.indexOf(f[0]) >= 0}">${f[1]}</button>`)}</div></div>
      <div class="filtro-grupo"><span>Instrumento</span><div class="togs">${S.base.instrumentos.filter(i => i.ativo !== 'FALSE').map(i => html`<button type="button" class="tog" data-a="pIT" data-v="${i.id}" aria-pressed="${PF.instrumentos.indexOf(i.id) >= 0}">${i.nome}</button>`)}</div></div>
      <label class="campo"><span>Status</span><select data-c="pS">${[['ativos', 'Ativos'], ['inativos', 'Inativos'], ['', 'Todos']].map(o => html`<option value="${o[0]}" ${PF.status === o[0] ? raw('selected') : ''}>${o[1]}</option>`)}</select></label>
    </div><div id="lp"></div>`.s;
  desenhar();
  A.pB = el => { PF.busca = el.value; desenhar(); };
  const alternar = (lista, v) => { const i = lista.indexOf(v); if (i >= 0) lista.splice(i, 1); else lista.push(v); };
  A.pFT = el => { alternar(PF.funcoes, el.dataset.v); el.setAttribute('aria-pressed', PF.funcoes.indexOf(el.dataset.v) >= 0); desenhar(); };
  A.pIT = el => { alternar(PF.instrumentos, el.dataset.v); el.setAttribute('aria-pressed', PF.instrumentos.indexOf(el.dataset.v) >= 0); desenhar(); };
  A.pS = el => { PF.status = el.value; desenhar(); };
}

async function telaPessoa(pg, id) {
  if (!pode('pessoas.editar')) { pg.innerHTML = html`<div class="aviso erro">Você não tem permissão para editar cadastros.</div>`.s; return; }
  await recarregarBase();
  const nova = id === 'nova';
  const p = nova ? { nome: '', email: '', telefone: '', voz: '', ativo: true, ministro: false, back: false, musico: false, instrumentos: [], obsAdmin: '' } : S.base.pessoas.find(x => x.id === id);
  if (!p) { pg.innerHTML = html`<div class="vazio">Pessoa não encontrada. <a href="#/pessoas">Voltar</a></div>`.s; return; }
  const F = JSON.parse(JSON.stringify(p));
  const gerUs = pode('usuarios.gerenciar');
  let usuario = null;
  if (gerUs && p.usuario) usuario = (await api('usuarios.listar')).usuarios.find(u => u.id === p.usuario.id);
  const sujo = () => { saidaPendente = () => confirmar('Há alterações não salvas neste cadastro. Sair mesmo assim?', 'Sair sem salvar', true); };
  const desenharInstr = () => {
    $('#instr').style.display = F.musico ? '' : 'none';
    $('#instr .togs').innerHTML = S.base.instrumentos.filter(i => i.ativo !== 'FALSE' || F.instrumentos.indexOf(i.id) >= 0).map(i => html`<button type="button" class="tog" data-a="pInstr" data-v="${i.id}" aria-pressed="${F.instrumentos.indexOf(i.id) >= 0}">${i.nome}</button>`.s).join('');
  };
  const perms = S.base.permissoesDisponiveis || {};
  pg.innerHTML = html`${voltar('#/pessoas', 'Pessoas')}<div class="cab"><div class="tit"><h1>${nova ? 'Nova pessoa' : p.nome}</h1>
    ${!nova && p.atualizadoEm ? html`<p class="peq">Última alteração por ${p.atualizadoPor} em ${fmtQuando(p.atualizadoEm)}</p>` : ''}</div></div>
    <div class="card">
      <label class="campo"><span>Nome completo</span><input type="text" value="${F.nome}" data-i="pfT" data-k="nome" maxlength="120" required></label>
      <div class="linha"><label class="campo"><span>E-mail (opcional)</span><input type="email" value="${F.email}" data-i="pfT" data-k="email"></label>
      <label class="campo"><span>Telefone (opcional)</span><input type="tel" value="${F.telefone}" data-i="pfT" data-k="telefone"></label></div>
      <div class="campo"><span>Como serve</span><small>Escolha uma ou mais.</small>
        <div class="togs">${[['ministro', 'Ministro(a)'], ['back', 'Back vocal'], ['musico', 'Músico']].map(f => html`<button type="button" class="tog" data-a="pfServe" data-k="${f[0]}" aria-pressed="${!!F[f[0]]}">${f[1]}</button>`)}</div></div>
      <div id="instr" class="campo"><span>Instrumentos que toca</span><small>Escolha um ou mais.</small><div class="togs"></div>
        ${pode('config.editar') ? html`<small>Faltou algum? Cadastre em <a href="#/config">Configurações › Instrumentos</a>.</small>` : ''}</div>
      <label class="campo" style="max-width:320px"><span>Tipo de voz (opcional)</span><select data-c="pfT" data-k="voz"><option value="">Não informado</option><option ${F.voz === 'Todas' ? raw('selected') : ''} value="Todas">Todas (canta qualquer voz)</option>${S.base.tiposVoz.map(v => v.nome).concat(F.voz && F.voz !== 'Todas' && !S.base.tiposVoz.some(v => v.nome === F.voz) ? [F.voz] : []).map(v => html`<option ${v === F.voz ? raw('selected') : ''}>${v}</option>`)}</select><small>Aparece ao lado do nome na lista de backs da escala.</small></label>
      <label class="check"><input type="checkbox" data-c="pfB" data-k="ativo" ${F.ativo ? raw('checked') : ''}> Ativo (pode ser escalado)</label>
      <label class="campo" style="margin-top:10px"><span>Observações administrativas</span><textarea data-i="pfT" data-k="obsAdmin" maxlength="1000">${F.obsAdmin}</textarea><small>Visível apenas para quem edita cadastros.</small></label>
    </div>
    ${gerUs && !nova ? html`<section class="bloco"><h2>Acesso ao aplicativo</h2><div class="card" id="acesso"></div></section>` : ''}
    <div class="barra-salvar">${!nova ? html`<button class="btn perigo" data-a="pExcluir">Excluir</button>` : ''}<button class="btn pri" data-a="pSalvar">Salvar cadastro</button></div>`.s;
  desenharInstr();
  const desenharAcesso = () => {
    const el = $('#acesso'); if (!el) return;
    const u = usuario || { login: F.email || '', perfil: 'MEMBRO', permissoes: [], ativo: true };
    el.innerHTML = html`${usuario ? html`<p>Login: <b>${usuario.login}</b> · ${usuario.ativo ? 'ativo' : 'desativado'}${usuario.bloqueado ? ' · bloqueado por tentativas' : ''}${usuario.trocarSenha ? ' · aguardando troca da senha temporária' : ''}${usuario.ultimoAcesso ? ' · último acesso ' + fmtQuando(usuario.ultimoAcesso) : ''}</p>`
      : html`<p class="muted">Esta pessoa ainda não tem login. Crie um para ela consultar escalas e músicas.</p>`}
      <div class="linha"><label class="campo"><span>Login</span><input type="text" name="ulogin" value="${u.login}" autocapitalize="none" placeholder="e-mail ou nome.sobrenome"></label>
      <label class="campo"><span>Perfil</span><select name="uperfil">${['MEMBRO', 'LIDER', 'ADMIN'].map(k => html`<option value="${k}" ${u.perfil === k ? raw('selected') : ''}>${ROT_PERFIL[k]}</option>`)}</select><small>Liderança: escalas, pessoas, músicas, ensaios. Administrador: tudo, inclusive logins e configurações.</small></label></div>
      <div id="uperms" style="${u.perfil !== 'MEMBRO' ? 'display:none' : ''}"><span class="campo" style="margin:0"><span>Permissões extras do integrante</span><small>Por padrão, integrantes só consultam escalas publicadas, músicas e links.</small></span>
        ${Object.keys(perms).map(k => html`<label class="check"><input type="checkbox" name="uperm" value="${k}" ${u.permissoes.indexOf(k) >= 0 ? raw('checked') : ''}> ${perms[k]}</label>`)}</div>
      ${usuario ? html`<label class="check"><input type="checkbox" name="uativo" ${usuario.ativo ? raw('checked') : ''}> Acesso ativo</label>` : ''}
      <div class="acoes" style="margin-top:10px"><button class="btn pri" data-a="uSalvar">${usuario ? 'Salvar acesso' : 'Criar login'}</button>${usuario ? html`<button class="btn" data-a="uSenha">Gerar senha temporária</button>` : ''}</div>`.s;
    $('[name=uperfil]', el).addEventListener('change', e => { $('#uperms').style.display = e.target.value !== 'MEMBRO' ? 'none' : ''; });
  };
  desenharAcesso();
  const mostrarSenha = (login, s) => modal({ titulo: 'Senha temporária', corpo: html`<p>Envie estes dados para a pessoa por um canal privado. A senha aparece <b>só agora</b> e deverá ser trocada no primeiro acesso.</p>
    <p>Login: <b>${login}</b></p><div class="senha-temp">${s}</div>`, botoes: [{ t: 'Copiar', a: () => { const txt = 'Login: ' + login + '\nSenha temporária: ' + s; try { navigator.clipboard.writeText(txt).then(() => toast('Copiado.', 'ok'), () => toast('Não foi possível copiar; selecione a senha e copie manualmente.')); } catch (e) { toast('Não foi possível copiar; selecione a senha e copie manualmente.'); } return false; } }, { t: 'Concluir', cls: 'pri' }] });
  A.uSalvar = async () => {
    const el = $('#acesso');
    const r = await api('usuarios.salvar', { usuario: { id: usuario && usuario.id, pessoaId: p.id, login: $('[name=ulogin]', el).value, perfil: $('[name=uperfil]', el).value,
      permissoes: $$('[name=uperm]:checked', el).map(c => c.value), ativo: usuario ? $('[name=uativo]', el).checked : true } });
    usuario = r.usuario; desenharAcesso(); toast('Acesso salvo.', 'ok');
    if (r.senhaTemporaria) mostrarSenha(r.usuario.login, r.senhaTemporaria);
  };
  A.uSenha = async () => {
    if (!(await confirmar('Gerar uma nova senha temporária? A senha atual deixa de funcionar e a pessoa será desconectada.', 'Gerar senha'))) return;
    const r = await api('usuarios.senha', { id: usuario.id }); usuario.trocarSenha = true; desenharAcesso(); mostrarSenha(r.login, r.senhaTemporaria);
  };
  A.pfT = el => { F[el.dataset.k] = el.value; sujo(); };
  A.pfB = el => { F[el.dataset.k] = el.checked; sujo(); if (el.dataset.k === 'musico') desenharInstr(); };
  A.pInstr = el => { const v = el.dataset.v, i = F.instrumentos.indexOf(v); if (i < 0) F.instrumentos.push(v); else F.instrumentos.splice(i, 1); sujo(); desenharInstr(); };
  A.pfServe = el => { const k = el.dataset.k; F[k] = !F[k]; el.setAttribute('aria-pressed', F[k]); sujo(); if (k === 'musico') desenharInstr(); };
  A.pSalvar = async () => {
    const r = await api('pessoas.salvar', { pessoa: F, instrumentos: F.instrumentos });

    (r.avisos || []).forEach(a => toast(a));

    if (nova) location.hash = '#/pessoa/' + r.pessoa.id; else rota();
  };
  A.pExcluir = async () => {
    if (!(await confirmar('Excluir este cadastro? Só é possível se a pessoa nunca foi escalada. Caso contrário, desmarque “Ativo”.', 'Excluir', true))) return;
    await api('pessoas.excluir', { id: p.id }); saidaPendente = null; await recarregarBase(); toast('Cadastro excluído.', 'ok'); location.hash = '#/pessoas';
  };
}

function presencaUI(d) {
  const R = {}; d.participantes.forEach(p => { R[p.pessoaId] = { presenca: p.presenca || 'PENDENTE', justificativa: p.justificativa || '' }; });
  const orig = JSON.stringify(R);
  const desenhar = () => {
    $('#pres').innerHTML = v_(d.participantes.length ? html`<div class="lista">${d.participantes.map(p => html`<div class="pres"><div><b>${p.nome}</b>${p.registradoPor ? html`<div class="sub peq muted">registrado por ${p.registradoPor} em ${fmtQuando(p.registradoEm)}</div>` : ''}</div>
      <div class="seg" role="group" aria-label="Presença de ${p.nome}">${Object.keys(PRES).map(k => html`<button class="${R[p.pessoaId].presenca === k ? 'on ' + k : ''}" data-a="prSet" data-p="${p.pessoaId}" data-v="${k}" aria-pressed="${R[p.pessoaId].presenca === k}">${PRES[k]}</button>`)}</div>
      ${R[p.pessoaId].presenca === 'JUSTIFICADA' ? html`<input class="just" type="text" placeholder="Justificativa (obrigatória)" value="${R[p.pessoaId].justificativa}" data-i="prJ" data-p="${p.pessoaId}">` : ''}</div>`)}</div>
      <div class="acoes" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-a="prTodos">Marcar pendentes como presentes</button><button class="btn pri" data-a="prSalvar">Salvar presença</button></div>`
      : html`<div class="vazio">Nenhum participante convocado.</div>`);
  };
  desenhar();
  A.prSet = el => { R[el.dataset.p].presenca = el.dataset.v; desenhar(); if (el.dataset.v === 'JUSTIFICADA') { const i = $('#pres [data-p="' + el.dataset.p + '"].just'); if (i) i.focus(); } };
  A.prJ = el => { R[el.dataset.p].justificativa = el.value; };
  A.prTodos = () => { Object.keys(R).forEach(k => { if (R[k].presenca === 'PENDENTE') R[k].presenca = 'PRESENTE'; }); desenhar(); };
  A.prSalvar = async () => {
    if (JSON.stringify(R) === orig) return toast('Nenhuma alteração de presença.');
    const r = await api('ensaios.presenca', { ensaioId: d.ensaio.id, registros: Object.keys(R).map(k => Object.assign({ pessoaId: k }, R[k])) });
    toast(r.alterados + ' registro(s) atualizado(s).', 'ok'); rota();
  };
}
